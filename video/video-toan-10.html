
<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_blank">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giao diện bài giảng NAMINS</title>

<style>

/* ==========================================
   RESET
========================================== */
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    overflow-x:hidden;
    background:#fdfdfd;
    font-family:'Segoe UI',Arial,sans-serif;
}

/* ==========================================
   WRAPPER
========================================== */
.wrapper-layout{
    max-width:1100px;
    margin:0 auto;
    padding:20px;
    width:100%;
}

.subject-title{
    font-size:24px;
    font-weight:bold;
    color:#1e4620;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:8px;
}

.search-box{
    float:right;
    margin-bottom:15px;
}

.search-box input{
    width:200px;
    padding:8px 15px;
    border-radius:25px;
    border:1px solid #c7d2d8;
    background:#f1f4f6;
    outline:none;
    font-size:14px;
}

/* ==========================================
   MAIN LAYOUT
========================================== */
.main-container{
    display:grid;
    grid-template-columns:1fr 256px;
    width:100%;
    background:#000;
    border-radius:4px;
    overflow:hidden;
    clear:both;
}

.video-column{
    background:#000;
    display:flex;
    flex-direction:column;
}

/* ==========================================
   VIDEO HEADER
========================================== */
.video-header{
    background:#1e4620;
    color:#fff;
    padding:5px 15px;
    font-size:14px;
    font-weight:600;
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:32px;
}

.btn-maximize{
    width:24px;
    height:24px;
    border-radius:4px;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,0.2);
    color:#fff;
}

/* ==========================================
   VIDEO FIX iPAD SAFARI
========================================== */
.video-wrapper{
    position:relative;
    width:100%;
    background:#000;
    overflow:hidden;
}

/* giữ tỉ lệ 16:9 ổn định mọi thiết bị */
.video-wrapper::before{
    content:"";
    display:block;
    padding-top:56.25%;
}

.video-wrapper iframe{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:100%;

    border:none;
    background:#000;
    display:block;
}

/* ==========================================
   SIDEBAR
========================================== */
.sidebar-column{
    background:#fff;
    border-left:1px solid #dcdcdc;
    display:flex;
    flex-direction:column;
    height:calc((1100px - 256px) * 9 / 16 + 32px);
}

@media (max-width:1100px){
    .sidebar-column{
        height:calc((100vw - 296px) * 9 / 16 + 32px);
    }
}

.sidebar-header{
    background:#fff;
    color:#1e4620;
    height:32px;
    font-size:13.5px;
    font-weight:800;
    display:flex;
    justify-content:center;
    align-items:center;
    border-bottom:3px solid #1e4620;
}

.menu-scroll-container{
    flex-grow:1;
    overflow-y:auto;
    padding-top:5px;
}

.lesson-row-block{
    border-bottom:1px dashed #f1f5f9;
}

.menu-lesson-header{
    background:#fff;
    padding:10px 12px;
    font-size:13.5px;
    font-weight:700;
    color:#334155;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.menu-lesson-header.has-child::after{
    content:'▾';
    font-size:10px;
    color:#94a3b8;
    margin-left:6px;
}

.menu-lesson-header.has-child.collapsed::after{
    transform:rotate(-90deg);
}

.lesson-parts-container{
    display:block;
    background:#fafbfc;
}

.lesson-parts-container.hidden{
    display:none;
}

.menu-item{
    padding:8px 12px 8px 24px;
    font-size:12.5px;
    color:#475569;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    border-top:1px solid #f1f5f9;
}

.menu-item.active{
    background:#f0fdf4;
    color:#166534;
    font-weight:600;
    border-left:4px solid #1e4620;
    padding-left:20px;
}

.lesson-name{
    flex-grow:1;
}

.current-lesson-bottom-display{
    text-align:center;
    font-size:16px;
    font-weight:bold;
    color:#1e4620;
    margin-top:20px;
    margin-bottom:10px;
    margin-right:256px;
}

/* ==========================================
   FOOTER
========================================== */
.footer-action{
    margin:40px 0 15px;
    display:flex;
    gap:30px;
    align-items:center;
}

.btn-register{
    background:linear-gradient(to bottom,#cfa846,#9c7514);
    color:#fff;
    padding:14px 35px;
    border-radius:25px;
    border:none;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.link-detail{
    color:#1e4620;
    font-weight:bold;
    text-decoration:none;
}

.copyright{
    color:#999;
    font-size:14px;
    margin-top:15px;
}

/* ==========================================
   MOBILE
========================================== */
@media (max-width:768px){

    .main-container{
        grid-template-columns:1fr;
    }

    .sidebar-column{
        border-left:none;
        border-top:1px solid #dcdcdc;
        height:auto;
        max-height:320px;
    }

    .current-lesson-bottom-display{
        margin-right:0;
    }

    .footer-action{
        flex-direction:column;
        text-align:center;
    }
}

</style>
</head>

<body>

<div class="wrapper-layout">

    <div class="search-box">
        <input type="text" placeholder="Tìm kiếm học liệu...">
    </div>

    <div class="subject-title">
        <span>Toán 9</span>
    </div>

    <div class="main-container">

        <!-- VIDEO -->
        <div class="video-column">

            <div class="video-header">
                <span id="current-lesson-title">
                    Phần 1. Tính chất
                </span>

                <button class="btn-maximize">
                    ⛶
                </button>
            </div>

            <div class="video-wrapper">

                <iframe
                    id="video-player"
                    src="https://www.youtube.com/embed/ho87M1-qPLk?autoplay=0&rel=0&controls=1&playsinline=1&modestbranding=1&enablejsapi=1"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

        <!-- SIDEBAR -->
        <div class="sidebar-column">

            <div class="sidebar-header">
                <span>Khóa nền tảng</span>
            </div>

            <div class="menu-scroll-container">

                <div class="lesson-row-block">

                    <div class="menu-lesson-header has-child">
                        <span>Bài 1. Đại cương vật lí nhiệt</span>
                    </div>

                    <div class="lesson-parts-container">

                        <div class="menu-item active"
                             onclick="changeVideo('ho87M1-qPLk','Phần 1. Tính chất')">

                            <span class="lesson-name">
                                Phần 1. Tính chất
                            </span>

                        </div>

                        <div class="menu-item"
                             onclick="changeVideo('5IfDXZ3URzM','Phần 2. Ứng dụng')">

                            <span class="lesson-name">
                                Phần 2. Ứng dụng
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="current-lesson-bottom-display">
        Bài 1. Đại cương vật lí nhiệt
    </div>

    <div class="footer-action">

        <button class="btn-register">
            ĐĂNG KÍ HỌC NGAY
        </button>

        <a href="#" class="link-detail">
            GIỚI THIỆU VỀ NAMINS.COM
        </a>

    </div>

    <div class="copyright">
        © 2026 NAMINS
    </div>

</div>

<script>

/* ==========================================
   FIX iPAD SAFARI
========================================== */

function changeVideo(videoId,title){

    const iframe=document.getElementById('video-player');

    const newSrc=
        `https://www.youtube.com/embed/${videoId}?`+
        `autoplay=1`+
        `&rel=0`+
        `&controls=1`+
        `&playsinline=1`+
        `&modestbranding=1`+
        `&enablejsapi=1`;

    if(iframe.src!==newSrc){

        iframe.src=newSrc;

        /* ép Safari repaint */
        iframe.style.opacity='0.99';

        setTimeout(()=>{
            iframe.style.opacity='1';
        },50);
    }

    document.getElementById('current-lesson-title').innerText=title;

    document.querySelectorAll('.menu-item')
    .forEach(item=>item.classList.remove('active'));

    event.currentTarget.classList.add('active');
}

/* FIX XOAY MÀN HÌNH iPAD */
window.addEventListener('orientationchange',()=>{

    const iframe=document.getElementById('video-player');

    if(iframe){

        const currentSrc=iframe.src;

        iframe.src='';

        setTimeout(()=>{
            iframe.src=currentSrc;
        },100);
    }
});

</script>

</body>
</html>
