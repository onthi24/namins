
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAMINS - Hệ thống tự học</title>
    <style>
        :root {
            --primary-green: #1abc9c;
            --primary-blue: #3498db;
            --primary-orange: #e67e22;
        }

        /* Thiết lập chuẩn để không bị tràn màn hình */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #fdfdfd; 
            margin: 0;
            padding: 20px;
            font-size: 16px;
            overflow-x: hidden;
        }

        /* --- CẤU TRÚC HEADER MỚI --- */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 10px auto;
            width: 100%;
            background-color: #f1f4f6;
            padding: 0 10px;
            border-radius: 4px;
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 45px; /* Điều chỉnh chiều cao logo cho phù hợp */
            object-fit: contain;
            display: block;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            padding: 14px 20px;
            font-weight: 500;
            font-size: 16px;
            display: inline-block;
            transition: all 0.2s;
        }

        /* Menu Trang chủ đang chọn có gạch chân đen */
        .nav-item.active {
            font-weight: bold;
            background-color: #fff;
            border-bottom: 4px solid #000;
        }

        .nav-item:hover {
            background-color: #e2e8f0;
        }

        /* Tiêu đề chính và ô tìm kiếm */
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 25px auto;
            width: 100%;
        }

        .main-title {
            font-size: 38px;
            font-weight: 800;
            color: #134e4a; /* Màu xanh lá đậm */
            margin: 0;
        }

        /* TÌM KIẾM */
        .search-box input {
            width: 270px; 
            padding: 10px 16px; 
            border-radius: 25px;
            border: 1px solid #c7d2d8;
            background: #f1f4f6;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        /* LAYOUT 3 CỘT (MÁY TÍNH) */
        .container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* TIÊU ĐỀ CỘT */
        .column-header {
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: left;
        }

        .bg-green { background: #1a4d2e; }
        .bg-blue { background: #78281f; } /* Đồng bộ màu nâu gốm/đỏ gạch cho cột 2 */
        .bg-orange { background: #B5782A; }

        /* THIẾT KẾ Ô KHOÁ HỌC */
        .item-card {
            background: #fff;
            padding: 14px 18px; 
            border-radius: 16px;
            border: 1.5px solid #b5b5b5; 
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08); 
            text-decoration: none;
            display: block;
        }

        .item-card:hover {
            background-color: #f8fafc;
            border-color: #78281f;
        }

        .item-card h2 {
            margin: 0;
            font-weight: 700; 
            color: #222; 
            font-size: 18px;
        }

        /* FOOTER ACTION (MÁY TÍNH) */
        .footer-action {
            margin: 40px auto 20px auto;
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            gap: 30px;
        }

        .btn-register {
            background: linear-gradient(to bottom, #d4af37, #a67c00);
            color: #fff;
            padding: 14px 35px; 
            border-radius: 25px;
            border: 1px solid #8e6f3e;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .link-detail { color: blue; font-weight: bold; text-decoration: none; font-size: 15px; text-transform: uppercase; } 
        .copyright { color: #999; font-size: 14px; padding-left: 20px; max-width: 1100px; margin: 0 auto 20px auto; }

        /* --- ĐIỀU CHỈNH HOÀN TOÀN CHO ĐIỆN THOẠI (DƯỚI 768PX) --- */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .top-navbar {
                flex-direction: column;
                padding: 10px;
                border-radius: 0;
            }

            .header-main {
                flex-direction: column;
                padding: 10px 15px;
                gap: 15px;
            }

            .main-title { text-align: center; font-size: 32px; }
            .search-box { width: 100%; }
            .search-box input { width: 100%; font-size: 15px; }

            .container {
                flex-direction: column;
                gap: 8px;
                padding: 0;
            }

            .column-header {
                border-radius: 0;
                font-size: 18px;  
                padding: 14px;
                text-align: center;
            }

            .item-card {
                border-radius: 0;
                border-left: none;
                border-right: none;
                padding: 14px;
            }

            .item-card h2 {
                font-size: 16px;
                text-align: center;
            }

            .footer-action {
                flex-direction: column;
                align-items: center;
                padding: 20px;
                gap: 20px;
            }

            .btn-register { width: 100%; font-size: 16px; }
            .copyright { text-align: center; font-size: 13px; padding-left: 0; }

            .goog-te-banner-frame, .skiptranslate, #goog-gt-tt { display: none !important; }
        }
    </style>
</head>
